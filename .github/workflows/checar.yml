name: Checar build

# Branches de trabalho: só confere se o site compila (não publica).
on:
  push:
    branches-ignore: [main]
    paths: ["web/**", ".github/workflows/checar.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
